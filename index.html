是借力好还是自力好呢？是否存在借力终究还是一场空，而自力方可得始终的情况。
 
其实这两个是不能分割的。如果没有自身的基础，是无法实现借力的。而如果不会借力，培养自力就无法究竟。最终其实是要和道合一，借道的力，这是怎样都无法避免的方向。自己只有两毛钱的人是借不到二百块钱的，也不会想到去借。而自己有一千万的人，如果不会运转借力，也无法真正驾驭金钱。与道合一的不会借不到力，也不会没有自力，因为道就可以生养这种力量。执着于这个或者那个，其实也还是不够究竟。
 
心性的提升是否就是道行的提升？这个过程中身体起到什么作用？
 
道行其实就是和大道相合的程度，心性确实可以直接影响这种程度。身体其实是阻碍，也是一个证明。比如身体五脏就会影响一个人的脾气和性格，这算是业根，这部分东西阻碍他去合一，那这部分就必须要处理。在修心的路上，身体是不能避免的课题。同时，身体也可以是一种明证，因为身心一体但心是虚的身是实的，对无法证虚的情况，就需要明明白白的实证。借假修真就是因为假才是可以普通人看见的。
 
如果修心就可以，为何需要很多法门？
 
这还是虚和实，假和真，下和上的问题。比如有人问路，懂方向的人我告诉他往东就可以了，但如果是不明方向的人，就要告诉他先往哪里走，会看到一个路口，再往哪里走，会看到一个房子。如果你身处毫无涟漪的湖面，怎样证明你身处湖面呢？那就扔下一颗石子。但扔下这颗石子是有意义的吗？有，又没有。如果你明白这是湖面，那就没有。如果你不明白又需要明白，那就有。有人扔石子有人扔树叶，就是千变万化的法门了。但是归根结底，要做的都是与道合一。但只有四个字，大众还是无法明白的。
就像你问的问题都没有意义，但是你问了，道就要显化给你了解。但种种显化只是显化不是本身。因此执着于法，法门，甚至具象的神，都不究竟。

    // 状态管理
    let allQuotes = [];
    let displayQuotes = [];
    let currentIndex = 0;
    let currentTheme = 'pink';

    // 核心 DOM 节点
    const body = document.body;
    const themeThumb = document.getElementById('themeThumb');
    const themeEmoji = document.getElementById('themeEmoji');
    const mainScroll = document.getElementById('mainScroll');
    const quoteCard = document.getElementById('quoteCard');
    const quoteDate = document.getElementById('quoteDate');
    const quoteText = document.getElementById('quoteText');
    const quoteIndex = document.getElementById('quoteIndex');
    const searchInput = document.getElementById('searchInput');
    const toast = document.getElementById('toast');

    // 初始化
    function init() {
      // 解析数据
      const blocks = rawTextData.split('#灵言灵语#').filter(b => b.trim() !== '');
      allQuotes = blocks.map(block => {
        const lines = block.trim().split('\n');
        return {
          date: lines[0].trim(),
          text: lines.slice(1).join('\n').trim()
        };
      }).filter(q => q.text.length > 0);

      displayQuotes = [...allQuotes];
      if (displayQuotes.length > 0) {
        quoteCard.style.display = 'flex';
        randomQuote();
      }
    }

    // 渲染当前卡片
    function render() {
      if (displayQuotes.length === 0) {
        quoteCard.style.display = 'none';
        return;
      }
      quoteCard.style.display = 'flex';
      const q = displayQuotes[currentIndex];
      quoteDate.innerText = q.date;
      quoteText.innerText = q.text;
      quoteIndex.innerText = `${currentIndex + 1} / ${displayQuotes.length}`;
      mainScroll.scrollTop = 0; // 滚动回顶部
    }

    // 主题切换逻辑
    function toggleTheme() {
      if (currentTheme === 'pink') {
        currentTheme = 'green';
        body.className = 'theme-green';
        themeThumb.className = 'toggle-thumb green';
        themeEmoji.innerText = '🍀';
      } else if (currentTheme === 'green') {
        currentTheme = 'retro';
        body.className = 'theme-retro';
        themeThumb.className = 'toggle-thumb retro';
        themeEmoji.innerText = '🍁';
      } else {
        currentTheme = 'pink';
        body.className = 'theme-pink';
        themeThumb.className = 'toggle-thumb';
        themeEmoji.innerText = '🎀';
      }
    }

    // 导航逻辑
    function randomQuote() {
      if (displayQuotes.length <= 1) return;
      let nextIdx = currentIndex;
      while (nextIdx === currentIndex) {
        nextIdx = Math.floor(Math.random() * displayQuotes.length);
      }
      currentIndex = nextIdx;
      render();
    }

    function prevQuote() {
      if (displayQuotes.length === 0) return;
      currentIndex = currentIndex - 1;
      if (currentIndex < 0) currentIndex = displayQuotes.length - 1;
      render();
    }

    function nextQuote() {
      if (displayQuotes.length === 0) return;
      currentIndex = (currentIndex + 1) % displayQuotes.length;
      render();
    }

    // 搜索逻辑
    function onSearch() {
      const val = searchInput.value.trim();
      const filtered = allQuotes.filter(q => q.text.includes(val) || q.date.includes(val));
      displayQuotes = filtered.length > 0 ? filtered : allQuotes;
      currentIndex = 0;
      render();
    }

    // 复制逻辑
    function copyQuote() {
      const q = displayQuotes[currentIndex];
      const textToCopy = `${q.text}\n—— 灵言灵语 ${q.date}`;
      
      navigator.clipboard.writeText(textToCopy).then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(err => {
        console.error('复制失败', err);
      });
    }

    // 启动
    init();
  </script>
